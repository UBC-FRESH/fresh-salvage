[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "masc-yunhao-xu-linear"
version = "0.1.0a1"
description = "Linear principal-agent salvage-subsidy model for TSA29 Williams Lake timber supply (WS3 + HiGHS)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "UBC FRESH Lab"}]
keywords = [
    "forest-modelling",
    "optimization",
    "principal-agent",
    "salvage-logging",
    "highs",
    "scientific-computing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "PyYAML>=6",
    "highspy>=1.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=14",
    "pydantic>=2.6",
    "rich>=13",
    "typer>=0.9",
]

[project.urls]
Homepage = "https://github.com/UBC-FRESH/masc-yunhao-xu-linear"
Documentation = "https://ubc-fresh.github.io/masc-yunhao-xu-linear/"
Repository = "https://github.com/UBC-FRESH/masc-yunhao-xu-linear"
Issues = "https://github.com/UBC-FRESH/masc-yunhao-xu-linear/issues"
Changelog = "https://github.com/UBC-FRESH/masc-yunhao-xu-linear/blob/main/CHANGE_LOG.md"

[project.optional-dependencies]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.5",
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
    "twine>=5",
]
quality = [
    "ruff>=0.5",
]
release = [
    "build>=1.2",
    "twine>=5",
]
test = [
    "pytest>=8",
]

[project.scripts]
masc-yunhao-xu-linear = "masc_yunhao_xu_linear.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
