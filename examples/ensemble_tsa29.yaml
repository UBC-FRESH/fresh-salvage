# Local example scenario-ensemble config for the full TSA29 (smoke grid).
#
# The scenario grid is the cartesian product of the named axes below; every
# axis is an explicit RHRunConfig field name (see
# fresh_salvage.models.RHRunConfig), so there is no positional ambiguity.
# Each scenario runs a full rolling-horizon coupled run (10 steps x 10
# implemented years, 15-period WS3 re-solves) in its own worker process with
# its own output root under the ensemble output_root. The derived no-LU WS3
# bridge is rebuilt once by the driver and shared read-only.
#
# Smoke grid: 2 subsidy levels x 2 fire-pattern multipliers = 4 scenarios,
# each ~2-4 minutes of single-scenario wall; max_workers 4 runs them all
# concurrently on a 64-core host.
#
#   fresh-salvage ensemble-run examples/ensemble_tsa29.yaml --json
#
# The paths below are machine-relative outputs of the earlier phases plus the
# external validated FEMIC TSA29 package. They are never vendored in this
# repository; replace the paths with your own run outputs before solving.
ensemble_id: tsa29-ensemble-smoke
base:
  stands_path: outputs/full_tsa/data/tsa29-full-stands.parquet
  yields_path: /srv/shared-data/gep/jupyterhub07-projects/davis/femic/external/femic-tsa29-instance/output/woodstock_tsa29_validated/woodstock_yields.csv
  bridge_path: /srv/shared-data/gep/jupyterhub07-projects/davis/femic/external/femic-tsa29-instance/output/woodstock_tsa29_validated/ws3_bridge
  base_year: 2025
  horizon: 15
  period_length: 10
  steps: 10
  max_age: 999
  # Per-scenario WS3 tree-gen/build worker threads. With max_workers
  # concurrent scenarios, total threads = max_workers * workers; see the
  # Phase 5.3 budget notes (workers 8 vs 64 made no measurable difference at
  # the 15-period horizon, so 8 is the tight ensemble default).
  workers: 8
  age_smashing:
    enabled: true
    width: 10
    midpoint: 5
  objective:
    action_code: cc
    utilization: 0.85
    even_flow_tolerance: 0.1
  aac_annual_m3: 2937509
  decay_rate: 0.85
  discount_rate: 0.03
  burned_limit_annual_m3: null
axes:
  # Principal/agent subsidy instrument ($ per m3 of burned volume salvaged).
  subsidy_rate_per_m3: [0.0, 3.0]
  # Future fire-pattern assumption: multiplier on every MFRI burn rate.
  burn_rate_multiplier: [1.0, 2.0]
max_workers: 4
output_root: outputs/ensemble_tsa29_smoke
metadata:
  description: 4-scenario smoke ensemble (2 subsidy levels x 2 fire multipliers), 100-year rolling-horizon runs.
