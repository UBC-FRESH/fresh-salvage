# Example adaptive subsidy flip-point search for the full TSA29.
#
# The search checks the inactive and active endpoints, then runs sequential
# midpoint probes to find the lowest subsidy producing positive burned salvage.
# It stops as soon as the inactive/active subsidy bracket is at most $0.50/m3,
# or after eight midpoint probes as a safety cap. Each probe is a full
# rolling-horizon run. Binary search is necessarily sequential, so max_workers
# must remain 1. Hold `workers` fixed:
# WS3 step objectives shift slightly with worker count (±0.014%).
#
#   fresh-salvage ensemble-run examples/ensemble_flip_sweep.yaml --json --strict
#
# The final bracket is recorded in the ensemble JSON and manifest. The
# fire-active case is held fixed below; use a separate config for the burn-rate
# control.
#
# The paths below are machine-relative outputs of the earlier phases plus the
# external validated FEMIC TSA29 package. They are never vendored in this
# repository; replace the paths with your own run outputs before solving.
ensemble_id: tsa29-ensemble-flip-sweep
base:
  stands_path: outputs/full_tsa/data/tsa29-full-stands.parquet
  yields_path: /home/xuyunhao/projects/salvage_harvesting_model/femic-tsa29-instance/output/woodstock_tsa29_validated/woodstock_yields.csv
  bridge_path: /home/xuyunhao/projects/salvage_harvesting_model/femic-tsa29-instance/output/woodstock_tsa29_validated/ws3_bridge
  base_year: 2025
  horizon: 15
  period_length: 10
  steps: 10
  max_age: 999
  workers: 1
  age_smashing:
    enabled: true
    width: 10
    midpoint: 5
  objective:
    action_code: cc
    utilization: 0.85
    even_flow_tolerance: 0.1
  aac_annual_m3: 2937509
  decay_rate: 0.85
  discount_rate: 0.03
  burned_limit_annual_m3: null
binary_search:
  axis: subsidy_rate_per_m3
  lower: 20.0
  upper: 30.0
  iterations: 8
  tolerance: 0.1
  threshold: 0.0
  metric: total_burned_harvest_m3
  fixed:
    burn_rate_multiplier: 1.0
max_workers: 1
output_root: outputs/ensemble_flip_sweep
metadata:
  description: Adaptive binary search for the subsidy at which burned salvage becomes positive; 100-year rolling-horizon probes.
