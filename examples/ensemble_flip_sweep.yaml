# Example subsidy flip-point sweep for the full TSA29 (post-calibration).
#
# Reproduces the prescribed 26-scenario sweep recorded in
# planning/phase6-validation-report.md: subsidy_rate_per_m3 in
# {0, 5, 8, 10, 12, 14, 15, 16, 18, 20, 22, 25, 30} crossed with
# burn_rate_multiplier in {0.0, 1.0} (the fire-free control). Each scenario
# is a full rolling-horizon run (10 steps x 10 implemented years, 15-period
# WS3 re-solves). Per-scenario WS3 workers 1 (the WS3 build is serial-bound;
# spend cores on max_workers instead); max_workers 64 runs the whole grid in
# ~2.5 minutes on a 64-core host. Hold `workers` fixed across the grid: WS3
# step objectives shift slightly with worker count (±0.014%).
#
#   fresh-salvage ensemble-run examples/ensemble_flip_sweep.yaml --json
#
# Optional fine probe that resolves the turn-on (append a second axes
# block run or edit in place), e.g. around the post-erratum window:
#   subsidy_rate_per_m3: [23.8, 23.85, 23.9, 24.0, 24.05, 24.1]
#   burn_rate_multiplier: [1.0]
#
# The paths below are machine-relative outputs of the earlier phases plus the
# external validated FEMIC TSA29 package. They are never vendored in this
# repository; replace the paths with your own run outputs before solving.
ensemble_id: tsa29-ensemble-flip-sweep
base:
  stands_path: outputs/full_tsa/data/tsa29-full-stands.parquet
  yields_path: /srv/shared-data/gep/jupyterhub07-projects/davis/femic/external/femic-tsa29-instance/output/woodstock_tsa29_validated/woodstock_yields.csv
  bridge_path: /srv/shared-data/gep/jupyterhub07-projects/davis/femic/external/femic-tsa29-instance/output/woodstock_tsa29_validated/ws3_bridge
  base_year: 2025
  horizon: 15
  period_length: 10
  steps: 10
  max_age: 999
  workers: 1
  age_smashing:
    enabled: true
    width: 10
    midpoint: 5
  objective:
    action_code: cc
    utilization: 0.85
    even_flow_tolerance: 0.1
  aac_annual_m3: 2937509
  decay_rate: 0.85
  discount_rate: 0.03
  burned_limit_annual_m3: null
axes:
  # Principal policy instrument ($ per m3 of burned volume salvaged). The
  # calibrated SPF development-type breakevens sit at 23.85-24.07 $/m3, so
  # the response is a ramp across ~23.9-24.1 and saturates at the physical
  # maximum 1,338,477.16 m3; the FESBC 14-15 $/m3 benchmark sits well below
  # the turn-on.
  subsidy_rate_per_m3: [0.0, 5.0, 8.0, 10.0, 12.0, 14.0, 15.0, 16.0, 18.0, 20.0, 22.0, 25.0, 30.0]
  # Future fire-pattern axis; 0.0 is the fire-free control (salvage exactly
  # zero at every subsidy — a nonzero value there indicates a wiring defect).
  burn_rate_multiplier: [0.0, 1.0]
max_workers: 64
output_root: outputs/ensemble_flip_sweep
metadata:
  description: 26-scenario subsidy flip-point sweep (13 subsidy levels x 2 fire multipliers), 100-year rolling-horizon runs.
