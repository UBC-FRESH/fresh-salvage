# Local example rolling-horizon run config for the full TSA29 (dev profile).
#
# 10 steps x 10 implemented years = 100 years. Each step solves a 15-period
# (150-year) WS3 schedule from the current cohort state, splits the period-1
# decadal harvest into 10 annual per-cohort ceilings for the principal LP,
# solves the agent LP against the principal offers, and replays the 10
# implemented years with fire dynamics to advance the cohort table.
#
# The paths below are machine-relative outputs of the earlier phases plus the
# external validated FEMIC TSA29 package. They are never vendored in this
# repository; replace the paths with your own run outputs before solving.
#
# Production profile (100 years, ~2-4 minutes):
#   fresh-salvage rh-run examples/rh_tsa29.yaml --json
run_id: tsa29-rh-100yr-dev
stands_path: outputs/full_tsa/data/tsa29-full-stands.parquet
yields_path: /srv/shared-data/gep/jupyterhub07-projects/davis/femic/external/femic-tsa29-instance/output/woodstock_tsa29_validated/woodstock_yields.csv
bridge_path: /srv/shared-data/gep/jupyterhub07-projects/davis/femic/external/femic-tsa29-instance/output/woodstock_tsa29_validated/ws3_bridge
base_year: 2025
horizon: 15
period_length: 10
steps: 10
max_age: 999
workers: 64
age_smashing:
  enabled: true
  width: 10
  midpoint: 5
objective:
  action_code: cc
  utilization: 0.85
  even_flow_tolerance: 0.1
aac_annual_m3: 2937509
# decay_rate/discount_rate match the standalone principal/agent defaults; the
# salvage subsidy rate itself (3.0 $/m3) is the shared data.py constant used
# by both LPs.
decay_rate: 0.85
discount_rate: 0.03
burned_limit_annual_m3: null
output_root: outputs/rh_100yr_dev
metadata:
  description: 100-year rolling-horizon WS3-principal-agent coupled run (10 x 10-year steps, 15-period WS3 solves).
