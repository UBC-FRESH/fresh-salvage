# Local example scenario for a full-TSA29 ingestion run.
#
# The wl_vfsl_path below is a machine-specific absolute path to the external
# predecessor WL_VFSL polygon layer. The data file is never vendored in this
# repository; this example simply points a local run at it. Replace the path
# with your own copy of WL_VFSL.csv before running.
#
# Run from the repository root:
#   fresh-salvage ingest examples/scenario_tsa29.yaml
run_id: tsa29-full
inputs:
  wl_vfsl_path: /srv/shared-data/gep/jupyterhub07-projects/davis/masc-yunhao-xu/Gurobi/Rolling_horizon_structure/WL_VFSL.csv
  output_root: outputs/full_tsa
fire: {}
# FS-VAL-01: the burn-severity ladder is a scenario-visible parameter. The
# values below are the package defaults (shown for documentation); omit the
# block to inherit them. "Medium" is normalized to "Moderate" via the alias;
# any other unmatched non-null rating is fatal (data_severity_unmatched).
# FS-VAL-02: rated stands are coverage-scaled by
# min(1, SHAPE_Area_1 / FEATURE_AREA_SQM) — an upper-bound proxy, not a true
# spatial intersection.
severity:
  severity_to_burned_frac:
    Unburned: 0.0
    Low: 0.30
    Moderate: 0.60
    High: 0.85
  severity_aliases:
    Medium: Moderate
# The economic surface (prices, harvest/transport costs, stumpage rates,
# subsidy) is likewise scenario-visible at ingestion. Omit the block to
# inherit the calibrated package defaults documented in
# planning/economics-calibration.md; a partial override is shown below.
# economics:
#   subsidy_rate_per_m3: 3.0
#   green_harvest_cost: 45.0
#   burned_harvest_cost: 56.0
#   green_transport_cost_per_m3: 30.0
#   burned_transport_cost_per_m3: 38.0
#   green_stumpage_rate: 15.0
#   burned_stumpage_rate: 0.25
#   burned_price_discount: 0.65
metadata:
  description: Full-TSA29 stand ingestion from the WL_VFSL polygon layer.
